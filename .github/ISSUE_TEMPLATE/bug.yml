name: Something broke
description: The app crashed, a card didn't open, or something else didn't work.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: app
    attributes:
      label: Which app the text was in
      placeholder: Safari, Preview, WeChat
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The sentence and the word you looked up help most.
  - type: dropdown
    id: source
    attributes:
      label: Where you got it
      options:
        - Mac download from GitHub or longyan.app
        - Homebrew
        - Microsoft Store
        - Windows installer from GitHub
  - type: input
    id: version
    attributes:
      label: Versions
      description: Report a Problem in the app's menu fills these in for you.
      placeholder: Longyan Reader 1.1, macOS 15.6, M1, 8 GB, reading model Qwen 3.5 4B (or Windows 11 24H2, x64, 16 GB)
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: "If the app quit on its own. On a Mac: open Console, choose Crash Reports, find LongyanReader and attach the newest one. On Windows: the app offers a report the next time it opens, with the end of its log."
