# The card states in windows/gallery drawn by the Windows app (--render), light and dark, to
# compare with the Mac's drawings of the same states (windows/gallery/mac, from
# scripts/card-gallery.sh). Only the C# app is built: drawing a card needs no core, so this
# runs in a couple of minutes, on any branch, for working on the card's looks.
name: gallery

on:
  push:
    paths:
      - windows/LongyanReader/**
      - windows/gallery/**
      - scripts/windows10-gallery.py
      - .github/workflows/gallery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dotnet build windows/LongyanReader -c Release -o app
      - name: Fonts the card uses, as this runner has them
        run: ls /c/Windows/Fonts | grep -iE '^(segui|segoeui|msyh|SegUIVar)' || true
      - name: Draw the cards
        run: |
          set -euo pipefail
          mkdir -p gallery-out
          app/LongyanReader.exe --render windows/gallery gallery-out
          ls gallery-out
      # The same, as on Windows 10 (WindowsBuild.cs): Segoe UI and Segoe MDL2 Assets, no Mica.
      # The card should come out the same size; the heights are compared.
      - name: Draw the cards as on Windows 10
        run: |
          set -euo pipefail
          LONGYAN_WINDOWS_BUILD=19045 app/LongyanReader.exe --render windows/gallery gallery-out/windows10
          python scripts/windows10-gallery.py gallery-out gallery-out/windows10 | tee gallery-out/windows10/sizes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-windows
          path: gallery-out
