# Builds the Windows app: the shared core as LongyanBridge.dll, the C# app around it, and a
# folder with everything it needs (the Swift and C++ runtimes, Resources), uploaded as the
# LongyanReader-windows artifact to try on a Windows PC or VM. Before that, the bridge check
# runs the lookups in scripts/bridge-check.txt from C# and compares the cards with the Mac's
# (scripts/bridge-check-expected.txt, from scripts/bridge-check.sh --update).
name: windows

on:
  push:
    branches: [shared-core, 'win/**']
    paths:
      - Package.swift
      - Sources/LongyanCore/**
      - Sources/LongyanBridge/**
      - Sources/LlamaSystem/**
      - Resources/**
      - patches/**
      - windows/**
      - scripts/bridge-check*
      - scripts/speed-check.txt
      - scripts/eval-lookups.py
      - scripts/pick-parity.py
      - notes/*-eval.tsv
      - scripts/stage-windows-resources.sh
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_TAG: b11588
  LLAMA_TAR_SHA: 37588f85e252f1b8753dcb200fba7198dc93e4f1b1615f459abffbe5662ac85d
  # The same key as core.yml's, so the two share the built llama.cpp.
  LLAMA_CACHE: v3
  PYTHONIOENCODING: utf-8

jobs:
  app:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llama
        with:
          path: Vendor/llama
          key: llama-${{ env.LLAMA_TAG }}-windows-${{ env.LLAMA_CACHE }}-${{ hashFiles('patches/llama.cpp-output-tokens.patch', 'patches/llama.cpp-windows.patch') }}
      - name: Build llama.cpp (CPU, DLLs)
        if: steps.llama.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/llama"; mkdir -p "$T/src"
          curl -fsSL -o "$T/src.tar.gz" "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$LLAMA_TAG.tar.gz"
          echo "$LLAMA_TAR_SHA  $T/src.tar.gz" | sha256sum -c
          (cd "$T" && tar -xzf src.tar.gz -C src --strip-components 1)
          (cd "$T/src" && git apply -p1 "$GITHUB_WORKSPACE/patches/llama.cpp-output-tokens.patch" \
                       && git apply -p1 "$GITHUB_WORKSPACE/patches/llama.cpp-windows.patch")
          # DLLs, with the CPU kernels built once per kind of x64 CPU (ggml-cpu-x64.dll, -sse42, -haswell,
          # -skylakex, -icelake, -alderlake...). ggml loads the best one the CPU runs, so CPUs without
          # AVX2 (Celeron, Pentium Silver, Atom) work too.
          cmake -S "$T/src" -B "$T/build" -A x64 -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_LIBDIR=lib \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_MTMD=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build "$T/build" --config Release -j 4
          cmake --install "$T/build" --config Release --prefix Vendor/llama
          # llama.cpp's simplest example, to run the model without the app (windows.yml's sse42 job).
          L=$(cygpath -m "$PWD/Vendor/llama"); S=$(cygpath -m "$T/src")
          mkdir -p "$T/simple"
          printf '%s\n' 'cmake_minimum_required(VERSION 3.20)' 'project(simple CXX)' \
            "add_executable(llama-simple $S/examples/simple/simple.cpp)" \
            "target_include_directories(llama-simple PRIVATE $L/include)" \
            "target_link_libraries(llama-simple PRIVATE $L/lib/llama.lib $L/lib/ggml.lib $L/lib/ggml-base.lib)" \
            'target_compile_features(llama-simple PRIVATE cxx_std_17)' > "$T/simple/CMakeLists.txt"
          cmake -S "$T/simple" -B "$T/simple/build" -A x64
          cmake --build "$T/simple/build" --config Release
          mkdir -p Vendor/llama/tools; cp "$T/simple/build/Release/llama-simple.exe" Vendor/llama/tools/
      - run: swift build -c release --product LongyanBridge
      - name: Stage the app folder
        run: |
          set -euo pipefail
          out=dist/LongyanReader
          mkdir -p "$out"
          ls .build/release/*.dll
          cp .build/release/LongyanBridge.dll "$out/"
          # llama.dll, ggml.dll, ggml-base.dll and the CPU kernels, ggml-cpu-*.dll.
          cp Vendor/llama/bin/*.dll "$out/"
          # The Swift runtime: the folder that holds swiftCore.dll on this runner.
          rt=$(cygpath -u "$(where.exe swiftCore.dll | head -1 | tr -d '\r')")
          echo "Swift runtime: $(dirname "$rt")"
          cp "$(dirname "$rt")"/*.dll "$out/"
          # The C++ runtime, which a fresh Windows may not have yet.
          for f in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do cp "/c/Windows/System32/$f" "$out/"; done
          scripts/stage-windows-resources.sh "$out/Resources"
          cp LICENSE "$out/LICENSE.txt"
          mkdir -p "$out/Licenses"
          cp Resources/licenses/llama.cpp-LICENSE.txt "$out/Licenses/llama.cpp.txt"
          { sed -n '/^#/p;/^[^#]/q' Resources/cedict_ts.u8; } > "$out/Licenses/CC-CEDICT.txt"
          du -sh "$out"
      - name: CPU kernels shipped
        run: |
          ls -l dist/LongyanReader/ggml*.dll dist/LongyanReader/llama.dll
          du -ch dist/LongyanReader/ggml*.dll dist/LongyanReader/llama.dll | tail -1
      - name: Bridge check
        run: |
          set -euo pipefail
          dotnet --list-sdks
          dotnet build windows/BridgeCheck -c Release -o check-bin
          cp dist/LongyanReader/*.dll check-bin/
          check-bin/BridgeCheck.exe dist/LongyanReader/Resources scripts/bridge-check.txt > bridge-raw.txt
          python scripts/bridge-normalize.py < bridge-raw.txt > bridge-windows.txt
          diff -u --strip-trailing-cr scripts/bridge-check-expected.txt bridge-windows.txt
      - name: Build the app
        run: |
          set -euo pipefail
          dotnet publish windows/LongyanReader -c Release -o publish
          cp -r publish/* dist/LongyanReader/
          ls dist/LongyanReader | head -50
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-check-windows
          path: |
            bridge-raw.txt
            bridge-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LongyanReader-windows
          path: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llama-simple
          path: Vendor/llama/tools/llama-simple.exe

  # The app on a real desktop, with the reading model: Notepad, a selection, Ctrl+Alt+L, then
  # screenshots and the card's text as UI Automation reads it.
  ui:
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LongyanReader-windows
          path: dist
      - name: Model folder
        run: echo "MODELS=$(cygpath -u "$LOCALAPPDATA")/LongyanReader/models" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: model
        with:
          path: ~/AppData/Local/LongyanReader/models
          key: model-qwen3.5-4b-q4_k_m-00fe7986
      - name: Download the reading model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$MODELS"
          curl -fL --retry 3 -o "$MODELS/qwen3.5-4b-q4_k_m.gguf" \
            "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf"
          echo "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4  $MODELS/qwen3.5-4b-q4_k_m.gguf" | sha256sum -c
      - run: dotnet build windows/UiCheck -c Release -o uicheck
      - name: Use the app
        run: |
          # The app adds a line there saying which CPU kernels ggml loaded.
          export LONGYAN_BACKEND_LOG="$(cygpath -w "$PWD/backend.txt")"
          uicheck/UiCheck.exe "$(cygpath -w "$PWD/dist/LongyanReader/LongyanReader.exe")" ui-out
      - name: CPU kernels used
        if: always()
        run: cat backend.txt || echo "no backend line, so the model didn't load"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-check
          path: ui-out

  # The kernels a CPU without AVX gets (Celeron, Pentium Silver, Atom): the model on
  # ggml-cpu-sse42.dll alone, then on the ones ggml picks here, for the speed. llama.cpp has no
  # SSE code for the model's Q4_K and Q6_K weights, so this is slow: too slow for the UI check's
  # three minutes a card, so llama-simple writes a few tokens instead.
  sse42:
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LongyanReader-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llama-simple
          path: tool
      - name: Model folder
        run: echo "MODELS=$(cygpath -u "$LOCALAPPDATA")/LongyanReader/models" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: model
        with:
          path: ~/AppData/Local/LongyanReader/models
          key: model-qwen3.5-4b-q4_k_m-00fe7986
      - name: Download the reading model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$MODELS"
          curl -fL --retry 3 -o "$MODELS/qwen3.5-4b-q4_k_m.gguf" \
            "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf"
          echo "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4  $MODELS/qwen3.5-4b-q4_k_m.gguf" | sha256sum -c
      - name: SSE 4.2 kernels only
        run: |
          set -euo pipefail
          m="$(cygpath -w "$MODELS/qwen3.5-4b-q4_k_m.gguf")"
          for v in sse42 all; do
            d=run-$v; mkdir -p $d
            cp tool/llama-simple.exe dist/LongyanReader/{llama,ggml,ggml-base,vcruntime140,vcruntime140_1,msvcp140}.dll $d/
            if [ $v = sse42 ]; then cp dist/LongyanReader/ggml-cpu-sse42.dll $d/; else cp dist/LongyanReader/ggml-cpu-*.dll $d/; fi
            echo "== $v: $(ls $d | grep ggml-cpu | tr '\n' ' ')"
            (cd $d && ./llama-simple.exe -m "$m" -n 12 "The capital of France is") > $v.txt 2> $v-log.txt || { cat $v-log.txt; exit 1; }
            grep -E "loaded CPU backend|decoded|prompt eval time|eval time" $v-log.txt || true
            echo "text: $(cat $v.txt)"
          done
          grep -q "ggml-cpu-sse42.dll" sse42-log.txt
          grep -q "Paris" sse42.txt


  # Where a card's time goes on this runner's CPU: the model's load, each request's prompt and
  # answer, and the card's first and settled times, through BridgeCheck with the model, for a
  # word and a phrase card and then another of each (scripts/speed-check.txt). Each setting
  # runs in a fresh process. Then the eval sets' words with the default and the fast settings,
  # to see whether any pick changes.
  speed:
    needs: [app, vulkan]
    if: always() && needs.app.result == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LongyanReader-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ggml-vulkan
          path: vulkan
      - name: Model folder
        run: echo "MODELS=$(cygpath -u "$LOCALAPPDATA")/LongyanReader/models" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: model
        with:
          path: ~/AppData/Local/LongyanReader/models
          key: model-qwen3.5-4b-q4_k_m-00fe7986
      - name: Download the reading model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$MODELS"
          curl -fL --retry 3 -o "$MODELS/qwen3.5-4b-q4_k_m.gguf" \
            "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf"
          echo "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4  $MODELS/qwen3.5-4b-q4_k_m.gguf" | sha256sum -c
      - name: The CPU
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed,L2CacheSize,L3CacheSize
          "memory: {0:N1} GB" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
      - name: Build BridgeCheck
        run: |
          dotnet build windows/BridgeCheck -c Release -o check-bin
          cp dist/LongyanReader/*.dll check-bin/
      - name: Settings
        run: |
          set -euo pipefail
          m="$(cygpath -w "$MODELS/qwen3.5-4b-q4_k_m.gguf")"
          res=dist/LongyanReader/Resources
          mkdir -p speed
          run() {
            local name=$1; shift
            echo "== $name: $*"
            env "$@" LONGYAN_TIMING=1 check-bin/BridgeCheck.exe $res scripts/speed-check.txt "$m" > speed/$name.txt 2> speed/$name-log.txt || { tail -20 speed/$name-log.txt; return 0; }
            grep -E "^(timing|time:|prefix hit|snapshot hit|llama.cpp CPU)" speed/$name-log.txt || true
          }
          # base: as before this job (no repacking, threads = CPUs - 2, starts of 64+ tokens kept).
          old="LONGYAN_PRIME=0 LONGYAN_REPACK=0 LONGYAN_THREADS=2"
          run base $old
          run base-again $old
          run t3 $old LONGYAN_THREADS=3
          run t4 $old LONGYAN_THREADS=4
          run repack $old LONGYAN_REPACK=1
          run repack-t3 $old LONGYAN_REPACK=1 LONGYAN_THREADS=3
          run repack-t4 $old LONGYAN_REPACK=1 LONGYAN_THREADS=4
          run repack-t2b4 $old LONGYAN_REPACK=1 LONGYAN_THREADS=2 LONGYAN_THREADS_BATCH=4
          run repack-t4-fa0 $old LONGYAN_REPACK=1 LONGYAN_THREADS=4 LONGYAN_FA=0
          run repack-t4-fa1 $old LONGYAN_REPACK=1 LONGYAN_THREADS=4 LONGYAN_FA=1
          run repack-t4-u256 $old LONGYAN_REPACK=1 LONGYAN_THREADS=4 LONGYAN_UBATCH=256
          run repack-t4-prime $old LONGYAN_REPACK=1 LONGYAN_THREADS=4 LONGYAN_PRIME=1
          # The defaults now, with a warm-up 20 s before the first card (the eye, or an earlier card).
          run now X=1
          run now-warm BRIDGE_WARM=20
          # ggml-vulkan.dll beside the bridge, with no Vulkan device here: the same as on the CPU.
          if [ -f vulkan/ggml-vulkan.dll ]; then
            cp vulkan/ggml-vulkan.dll check-bin/
            run now-vulkan-dll X=1
            rm check-bin/ggml-vulkan.dll
          fi
          for f in speed/*.txt; do case $f in *-log.txt) ;; *) python scripts/bridge-normalize.py < $f > $f.norm ;; esac; done
          for f in speed/*.txt.norm; do cmp -s speed/base.txt.norm $f && echo "same cards as base: $f" || echo "DIFFERENT cards from base: $f"; done
          for f in speed/now*.txt.norm; do cmp -s speed/now.txt.norm $f && echo "same cards as now: $f" || echo "DIFFERENT cards from now: $f"; done
      - name: Eval picks, default and fast
        run: |
          set -euo pipefail
          m="$(cygpath -w "$MODELS/qwen3.5-4b-q4_k_m.gguf")"
          res=dist/LongyanReader/Resources
          python scripts/eval-lookups.py notes/note-pick-eval.tsv notes/phrase-eval.tsv > speed/evals.txt
          for cfg in "base LONGYAN_PRIME=0 LONGYAN_REPACK=0 LONGYAN_THREADS=2" "fast LONGYAN_REPACK=1 LONGYAN_THREADS=4"; do
            set -- $cfg; name=$1; shift
            start=$(date +%s)
            env "$@" BRIDGE_QUIET=0.3 LONGYAN_TIMING=1 check-bin/BridgeCheck.exe $res speed/evals.txt "$m" > speed/evals-$name.txt 2> speed/evals-$name-log.txt
            echo "$name: $(( $(date +%s) - start )) s for $(wc -l < speed/evals.txt) lookups"
            python scripts/pick-parity.py picks speed/evals.txt speed/evals-$name.txt > speed/picks-$name.txt
          done
          diff speed/picks-base.txt speed/picks-fast.txt && echo "same picks" || echo "picks differ: $(diff speed/picks-base.txt speed/picks-fast.txt | grep -c '^<') lines"
          for cfg in "base LONGYAN_PRIME=0 LONGYAN_REPACK=0 LONGYAN_THREADS=2" "fast LONGYAN_REPACK=1 LONGYAN_THREADS=4"; do
            set -- $cfg; name=$1; shift
            env "$@" LONGYAN_TIMING=1 check-bin/BridgeCheck.exe $res scripts/bridge-check.txt "$m" > speed/bridge-$name.txt 2> speed/bridge-$name-log.txt
            python scripts/bridge-normalize.py < speed/bridge-$name.txt > speed/bridge-$name.norm
          done
          diff speed/bridge-base.norm speed/bridge-fast.norm && echo "same cards" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed
          path: speed

  # ggml's Vulkan backend as one more DLL (ggml-vulkan.dll), for GPUs from Intel, AMD, NVIDIA and
  # Qualcomm. Not in the app folder yet: CI has no GPU to measure it on. The speed job checks the
  # fallback: with the DLL beside the app and no Vulkan device, the model runs on the CPU as before.
  vulkan:
    runs-on: windows-latest
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vk
        with:
          path: vulkan-out
          key: ggml-vulkan-${{ env.LLAMA_TAG }}-${{ env.VULKAN_VERSION }}-v1
      - name: Vulkan SDK
        if: steps.vk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install | Out-Host
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - name: Build ggml-vulkan.dll
        if: steps.vk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/llama"; mkdir -p "$T/src"
          curl -fsSL -o "$T/src.tar.gz" "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$LLAMA_TAG.tar.gz"
          echo "$LLAMA_TAR_SHA  $T/src.tar.gz" | sha256sum -c
          (cd "$T" && tar -xzf src.tar.gz -C src --strip-components 1)
          (cd "$T/src" && git apply -p1 "$GITHUB_WORKSPACE/patches/llama.cpp-output-tokens.patch" \
                       && git apply -p1 "$GITHUB_WORKSPACE/patches/llama.cpp-windows.patch")
          cmake -S "$T/src" -B "$T/build" -A x64 -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_CPU=OFF -DGGML_VULKAN=ON \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_MTMD=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_APP=OFF
          cmake --build "$T/build" --config Release --target ggml-vulkan -j 4
          mkdir -p vulkan-out
          cp "$T/build/bin/Release/ggml-vulkan.dll" vulkan-out/
          ls -l vulkan-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ggml-vulkan
          path: vulkan-out
