# Publishes site/ to GitHub Pages (longyan.app) when it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Built and deployed in two jobs: deploy-pages looks the artifact up once, and in the same
  # job straight after the upload it sometimes isn't listed yet ("No artifacts named
  # github-pages"). A second job only starts once the first has finished.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The videos aren't in git (each version added 25-36 MB to every clone); they're
      # assets of the site-media pre-release, fetched into site/media/ here.
      - name: Fetch the videos
        run: gh release download site-media --repo "$GITHUB_REPOSITORY" --dir site/media --pattern '*.mp4'
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
