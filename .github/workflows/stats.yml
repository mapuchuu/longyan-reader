# Counts app downloads for the README badge: every Mac zip of every release (the website's
# LongyanReader.zip and the versioned zips Sparkle updates fetch) and every Windows installer
# (LongyanReader-Setup-<version>-<arch>.exe, from the site and from WinSparkle updates),
# betas included. The appcasts and the site-media videos aren't counted, and neither are
# drafts. Writes downloads.json to the stats branch, which shields.io reads as an endpoint
# badge. Runs hourly.
name: Download stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .prerelease as $pre | .assets[]
              | select(((.name | endswith(".zip")) and ($pre | not)) or (.name | test("^LongyanReader-Setup-.+\\.exe$")))
              | .download_count' \
            | awk '{s += $1} END {print s + 0}')
          echo "downloads: $total"
          mkdir out && cd out
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"30d158"}\n' "$total" > downloads.json
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "Download count: $total"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" stats
